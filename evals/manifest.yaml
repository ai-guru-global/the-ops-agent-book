    issue: Run the candidate model and real tool contracts against the frozen 400-case suite; archive raw traces and outcomes.
    owner: agent-evaluation
    due_date: "2026-12-15"
    blocks_gate: G3
    acceptance: "400/400 cases have non-mock traces, immutable result hashes and independent acceptance signatures."
    status: open
