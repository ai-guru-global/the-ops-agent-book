root_causes:
  direct: A bad payments-api deployment increased the 5xx rate.
  contributing: The context cache served a 35-minute-old snapshot as current.
  systemic: Cache TTL was longer than the 10-minute evidence contract and lacked a stale marker.
  detection_gap: The cache-age metric was not connected to the Agent freshness alarm.
  prevention_gap: Golden and calibration suites lacked a stale-cache-plus-write-request case.
